name: Sync Feishu to Dida

on:
  schedule:
    - cron: '0 */2 * * *'  # UTC时区，每2小时执行一次
  workflow_dispatch:        # 手动触发默认预演；execute=true 才真实写入
    inputs:
      execute:
        description: "真实执行同步（会更新/删除滴答任务）"
        required: true
        default: false
        type: boolean

permissions:
  contents: write            # 允许自动提交 mapping.json

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Run sync
        env:
          # ── 飞书 API 凭据 ──
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          # ── 滴答凭据（5 个） ──
          DIDA_CLIENT_ID: ${{ secrets.DIDA_CLIENT_ID }}
          DIDA_CLIENT_SECRET: ${{ secrets.DIDA_CLIENT_SECRET }}
          DIDA_TOKEN: ${{ secrets.DIDA_TOKEN }}
          DIDA_REFRESH_TOKEN: ${{ secrets.DIDA_REFRESH_TOKEN }}
          DIDA_PROJECT_ID: ${{ secrets.DIDA_PROJECT_ID }}
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.execute }}" != "true" ]]; then
            python sync.py --json
          else
            python sync.py --run --json
          fi

      - name: Commit mapping changes
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add state/mapping.json
          git diff --cached --quiet || git commit -m "Auto: update mapping.json [skip ci]"
          git push
        if: always()
